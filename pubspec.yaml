name: duka
description: Multi-vendor marketplace app for Women, Kids, Beauty, Maternity, and Home & Lifestyle.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.2.2
  # Add these to enable native Google/Apple sign-in buttons in login_screen.dart
  # (wire the returned id_token into ApiService.instance.socialLogin):
  # google_sign_in: ^6.2.1
  # sign_in_with_apple: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
